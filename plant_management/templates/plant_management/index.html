{% load static %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'bonjour-plant.css' %}" rel="stylesheet">
    <link rel="icon" href="{% static 'bonjour-plant-icon.svg' %}">
    <title>Bonjour Plant</title>
  </head>
  <body>
    <header class="plant-header">
      <div class="header-inner">
        <a class="brand-link" href="{% url 'plant_management_index' %}">
          <img src="{% static 'bonjour-plant-icon.svg' %}" alt="Bonjour Plant">
          <div>
            <p class="brand-name">Bonjour Plant</p>
            <span class="brand-tagline">L'entretien des plantes, simple comme bonjour</span>
          </div>
        </a>
        <nav class="header-nav">
          <a href="{% url 'plant_management_index' %}" class="nav-link-btn">Accueil</a>
        </nav>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  {% block scripts %}{% endblock %}
  </body>
</html>
