{% load static %}
<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'bootstrap-icons.min.css' %}" rel="stylesheet">
    <link href="{% static 'bonjour-plant.css' %}" rel="stylesheet">
    <link rel="icon" href="{% static 'bonjour-plant-icon.svg' %}">
    <script src="{% static 'bootstrap.min.js' %}" defer></script>
    <script src="{% static 'htmx.min.js' %}" defer></script>
    <title>Bonjour Plant</title>
  </head>
  <body>
    <header class="plant-header">
      <div class="header-inner">
        <a class="brand-link" href="{% url 'growing_plants' %}">
          <img src="{% static 'bonjour-plant-icon.svg' %}" alt="Bonjour Plant">
          <div>
            <p class="brand-name">Bonjour Plant</p>
            <span class="brand-tagline">L'entretien des plantes, simple comme bonjour</span>
          </div>
        </a>
        <nav class="header-nav">
          <a href="{% url 'growing_plants' %}" class="nav-link-btn">
            <i class="bi bi-house-door"></i>
            Mes plantes
          </a>
          <div class="dropdown">
            <button class="nav-link-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-grid-3x3-gap"></i>
              Menu
              <i class="bi bi-chevron-down small"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end plant-dropdown">
              <li>
                <a class="dropdown-item" href="{% url 'plant_types' %}">
                  <i class="bi bi-flower1"></i>
                  Types de plantes
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="{% url 'metrics' %}">
                  <i class="bi bi-graph-up"></i>
                  Métriques
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="{% url 'sensors' %}">
                  <i class="bi bi-broadcast-pin"></i>
                  Capteurs
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="{% url 'actionners' %}">
                  <i class="bi bi-plug"></i>
                  Actionneurs
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="{% url 'growing_plants' %}">
                  <i class="bi bi-tree"></i>
                  Mes plantes
                </a>
              </li>
              <li>
                <a class="dropdown-item" href="{% url 'video' %}">
                  <i class="bi bi-camera-video"></i>
                  Vidéo
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item" href="{% url 'logs' %}">
                  <i class="bi bi-journal-text"></i>
                  Journal
                </a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  {% block scripts %}{% endblock %}
  </body>
</html>
