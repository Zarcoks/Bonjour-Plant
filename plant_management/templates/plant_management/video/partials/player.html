{% comment %}
The camera being watched, live. The player is a plain <video>: what fills it is
the HLS stream served at the address the camera was declared under, read by
hls.js — or by the browser itself where it knows how.
{% endcomment %}
{% if camera %}
  <figure class="video-frame">
    <video class="camera-player"
           data-hls="{{ camera.stream_url }}"
           autoplay muted playsinline controls></video>

    {% comment %}
      Shown by the player alone, when the stream never came: a camera unplugged,
      a path MediaMTX does not publish (yet), a Raspberry Pi out of reach.
    {% endcomment %}
    <div class="video-unavailable" hidden>
      <i class="bi bi-camera-video-off"></i>
      <p>Le flux de {{ camera.name }} n'arrive pas.</p>
      <span>Vérifiez que la caméra est branchée et que le flux est bien publié.</span>
    </div>

    <figcaption>
      <strong>{{ camera.name }}</strong>
      {% if camera.plant %}
        <span class="video-plant">
          <i class="bi bi-tree"></i>
          {{ camera.plant.display_name }}
        </span>
      {% endif %}
      <span class="video-address">{{ camera.stream_url }}</span>
      <span class="card-actions-spacer"></span>
      {# Rebuilding the player is how the stream is asked for again. #}
      <button class="btn-ghost" type="button"
              hx-get="{% url 'video' %}?camera={{ camera.pk }}"
              hx-target="#video-stage"
              hx-swap="innerHTML">
        <i class="bi bi-arrow-clockwise"></i>
        Relancer
      </button>
    </figcaption>
  </figure>
{% else %}
  <div class="empty-state video-empty">
    <i class="bi bi-camera-video"></i>
    <p>Ajoutez une caméra pour la regarder en direct.</p>
  </div>
{% endif %}
